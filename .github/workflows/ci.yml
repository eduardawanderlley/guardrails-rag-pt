name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Testes e red team (modo simulado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest

      # O modo simulado não chama API e não usa chave. O teste de red team em pytest
      # já falha se os guardrails deixarem passar algum ataque ou bloquearem pergunta legítima.
      - name: Gerar relatório de robustez
        run: python -m guardrails_rag redteam --llm simulated --output reports/robustness-ci.md

      - name: Publicar relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: robustness-report
          path: reports/robustness-ci.md
